name: Keep Supabase Alive

on:
  schedule:
    # Lunes y jueves a las 12:00 UTC (9:00 hora Argentina)
    - cron: '0 12 * * 1,4'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (mantener el proyecto activo)
        run: |
          curl -s -o /dev/null -w "Respuesta: %{http_code}\n" \
            "https://jzjthobcmbwszoagcaap.supabase.co/rest/v1/clientes?select=nombre&limit=1" \
            -H "apikey: sb_publishable_h8JzOOZqlJzyfyLuDuBEuw_wcD-xjs0" \
            -H "Authorization: Bearer sb_publishable_h8JzOOZqlJzyfyLuDuBEuw_wcD-xjs0"
